# Example config for synthesize.py (CLI flags override these)
count: 50
out: out
avatars: assets/avatars
icons: assets/icons
names: assets/names.txt
messages: assets/messages.txt
snippets: assets/snippets.txt
seed: 0
# window size ranges
width_min: 900
width_max: 1400
height_min: 600
height_max: 1000
# drop label if visible height < this (px) or area ratio below threshold
min_visible_h: 4
min_area_ratio: 0.00005
image_format: jpg  # jpg or png
jpg_quality: 92
